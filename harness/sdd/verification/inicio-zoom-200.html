<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificación local de Inicio · ampliación equivalente al 200 %</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        width: 50vw;
        height: 50vh;
        transform: scale(2);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <!-- Simulación explícita de ampliación: no modifica el zoom nativo de Edge.
         La sesión se obtiene ingresando normalmente en el iframe. -->
    <iframe title="Inicio ampliado al 200 % (simulación)" src="/login"></iframe>
  </body>
</html>
